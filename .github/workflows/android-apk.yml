name: Android APK - v0.1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK not found"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install ASANA launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon-source/asana-icon.webp.base64 > app/src/main/res/drawable-nodpi/asana_logo.webp
          file app/src/main/res/drawable-nodpi/asana_logo.webp
          test -s app/src/main/res/drawable-nodpi/asana_logo.webp
      - name: Lint and assemble debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASANA-Dosya-Yoneticisi-v0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
